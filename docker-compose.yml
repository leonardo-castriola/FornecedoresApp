services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:1434:1433"
    volumes:
      - fornecedores_sqlserver_data_v2:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/FornecedoresApp.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__BDFornecedores: "Server=sqlserver,1433;Database=BDFornecedores;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env};Encrypt=True;TrustServerCertificate=True"
      DevelopmentUser__Password: ${DEVELOPMENT_USER_PASSWORD:?Defina DEVELOPMENT_USER_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5214:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  fornecedores_sqlserver_data_v2:
